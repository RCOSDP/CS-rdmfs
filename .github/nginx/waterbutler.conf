server {
    listen 80;
    server_name _;

    client_max_body_size 9999m;

    location / {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.0;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://wb:7777;
    }
}
